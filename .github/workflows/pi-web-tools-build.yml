# Builds the ADS_web_tools WAR for every PR and every push to master.
# PR builds: compile + guardrails + GitHub artifact only (no AWS access).
# master / manual runs: additionally publish an immutable, versioned copy to S3,
# which is what the deploy workflow promotes dev -> qa -> prod.
name: pi-web-tools build

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# PRs share one group per PR, so a new push cancels the superseded run. Master pushes and
# manual runs get a group per run: nothing is queued and dropped, every merge is deployable.
concurrency:
  group: pi-web-tools-build-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WEBAPP_NAME: ADS_web_tools
  # war-tc7 bundles ojdbc8 on purpose today (see build.xml). ED-21599 wants the
  # driver only in <tomcat>/lib. Flip to "true" once Adam removes it from the WAR.
  FAIL_ON_BUNDLED_OJDBC: "false"

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # war-tc7 only. war-sandpiper targets Tomcat 5 and bundles servlet-api/jsp-api,
        # which Tomcat 7 rejects - and every PIT host (Sandpiper included) runs Tomcat 7.
        target: [war-tc7]
    steps:
      - name: Checkout
        # same pin as publish-sbom.yml / the org reusable workflows
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Jenkins used JDK 9.0.4 only because Ant's javac `release="8"` needs JDK 9+.
      # JDK 9 is long EOL; JDK 11 honours release=8 identically and the guardrail
      # step below proves the output is still Java 8 bytecode. If the build breaks
      # on 11, fall back to distribution: zulu / java-version: '9' and tell me why.
      - name: Set up JDK 11
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "11"

      - name: Install Apache Ant
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ant
          ant -version
          echo "JAVA_HOME=${JAVA_HOME}"   # Ant uses JAVA_HOME (the JDK 11 above), not apt's default JRE
          "${JAVA_HOME}/bin/java" -version

      - name: Compute version
        id: version
        # Mirrors Jenkins' -b<BUILD_NUMBER>-<SHORT_SHA> stamp, prefixed "gha" so the
        # numbers can never collide with historical Jenkins build numbers.
        run: echo "version=gha${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Ant build
        env:
          TARGET: ${{ matrix.target }}
        run: ant "${TARGET}"   # build.xml: verify-deps -> init (clean) -> compile (release=8) -> war

      - name: Locate WAR
        id: war
        run: |
          set -euo pipefail
          # build.xml writes dist/ADS_web_tools-<tc7|tc5>-<version>.war; init wipes dist/ first
          mapfile -t wars < <(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -type f -name 'ADS_web_tools-*.war')
          if [[ ${#wars[@]} -ne 1 ]]; then
            echo "::error::expected exactly one WAR from the build, found ${#wars[@]}: ${wars[*]:-none}"
            exit 1
          fi
          echo "path=${wars[0]}" >> "$GITHUB_OUTPUT"
          echo "Built: ${wars[0]}"

      - name: Guardrails (Java 8 bytecode, ojdbc, sanity)
        env:
          WAR: ${{ steps.war.outputs.path }}
        run: |
          set -euo pipefail
          flags=()
          [[ "$FAIL_ON_BUNDLED_OJDBC" == "true" ]] && flags+=(--fail-on-bundled-ojdbc)
          python3 .github/scripts/war_guardrails.py "$WAR" --max-major 52 "${flags[@]}"

      - name: Stage artifact + metadata
        env:
          WAR: ${{ steps.war.outputs.path }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ steps.version.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p out
          cp "$WAR" "out/${WEBAPP_NAME}.war"
          (cd out && sha256sum "${WEBAPP_NAME}.war" > "${WEBAPP_NAME}.war.sha256")
          jq -n \
            --arg version "$VERSION" --arg target "$TARGET" \
            --arg commit "$GITHUB_SHA" --arg ref "$GITHUB_REF" \
            --arg run_url "$RUN_URL" --arg source_war "$(basename "$WAR")" \
            --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg jdk "temurin-11" \
            '{version:$version,target:$target,commit:$commit,ref:$ref,run_url:$run_url,source_war:$source_war,built_at:$built_at,jdk:$jdk}' \
            > out/build-info.json
          cat out/build-info.json out/*.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pi-web-tools-${{ matrix.target }}
          path: out/
          retention-days: 30
          if-no-files-found: error

  publish:
    name: publish to S3 (${{ matrix.target }})
    needs: build
    # Skips itself until the AWS side exists (repo variable PIT_BUILD_ROLE_ARN set),
    # so merging this before the Terraform is applied can't turn master red.
    if: github.event_name != 'pull_request' && vars.PIT_BUILD_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # OIDC -> gha-pit-build role; no stored AWS keys
    strategy:
      fail-fast: false
      matrix:
        target: [war-tc7]
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pi-web-tools-${{ matrix.target }}
          path: out

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.PIT_BUILD_ROLE_ARN }}
          role-session-name: gha-pit-build-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Publish immutable build
        env:
          BUCKET: ${{ vars.ARTIFACT_BUCKET }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="$(jq -r .version out/build-info.json)"
          prefix="pi-web-tools/${TARGET}/${version}"
          marker="${prefix}/${WEBAPP_NAME}.war.sha256"   # uploaded last; its presence means "published"
          local_sha="$(awk '{print $1}' "out/${WEBAPP_NAME}.war.sha256")"

          # Existence check via ListObjectsV2: 0 = not published, 1 = published. Any S3 error
          # (403, throttling, network) fails the step under set -e instead of meaning "not published".
          count="$(aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "$marker" --query 'KeyCount' --output text)"
          if [[ "$count" != "0" ]]; then
            remote_sha="$(aws s3 cp "s3://${BUCKET}/${marker}" - | awk '{print $1}')"
            if [[ "$remote_sha" == "$local_sha" ]]; then
              echo "Version ${version} already published with identical checksum - nothing to do."
              exit 0
            fi
            # The version is run number + commit, so a mismatch can only come from "Re-run all jobs"
            # rebuilding the WAR (Ant writes new zip timestamps). Keep the original: versions are immutable.
            if (( GITHUB_RUN_ATTEMPT > 1 )); then
              echo "::notice::${version} was published by an earlier attempt of this run; keeping that build (sha256 ${remote_sha})."
              exit 0
            fi
            echo "::error::${prefix} already exists with a different checksum - refusing to overwrite"
            exit 1
          fi

          aws s3 cp "out/${WEBAPP_NAME}.war"        "s3://${BUCKET}/${prefix}/${WEBAPP_NAME}.war" --only-show-errors
          aws s3 cp "out/build-info.json"           "s3://${BUCKET}/${prefix}/build-info.json" --only-show-errors
          # checksum last: its presence marks the build as complete
          aws s3 cp "out/${WEBAPP_NAME}.war.sha256" "s3://${BUCKET}/${prefix}/${WEBAPP_NAME}.war.sha256" --only-show-errors

          {
            echo "### Published \`${version}\` (${TARGET})"
            echo "- s3://${BUCKET}/${prefix}/"
            echo "- sha256: \`${local_sha}\`"
            echo "- Deploy it: **Actions → pi-web-tools deploy → Run workflow**, version \`${version}\`"
          } >> "$GITHUB_STEP_SUMMARY"
